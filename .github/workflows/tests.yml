name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all sources
        run: python -m compileall -q src sim tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Simulate a mission with an unmapped obstacle
        # Exits non-zero if the robot fails to reach the goal or collides.
        run: python sim/simulate.py --quiet
